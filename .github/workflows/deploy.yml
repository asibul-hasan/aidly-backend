name: Sync to Hugging Face space
on:
  push:
    branches: [main] # Update this if your main branch is named 'master'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://asibul-07:$HF_TOKEN@huggingface.co/spaces/asibul-07/angulartail-nest-auth-flow main
